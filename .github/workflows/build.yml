name: Build Standalone AutoClicker Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Download iOS SDKs
      run: |
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

    - name: Clone SimpleAutoClicker
      run: |
        git clone --recursive https://github.com/DYY-Studio/iOS-SimpleAutoClicker.git clicker

    - name: Patch Constructor (Remove Substrate requirement for Jailed)
      run: |
        cd clicker
        python3 -c "
        with open('Tweak.x', 'r') as f:
            code = f.read()

        idx = code.find('__attribute__((constructor))')
        if idx != -1:
            new_ctor = '__attribute__((constructor))\nstatic void tweakConstructor() {\n    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{\n        [[AutoClickerManager sharedInstance] setupUI];\n    });\n}\n'
            code = code[:idx] + new_ctor

        with open('Tweak.x', 'w') as f:
            f.write(code)
        print('Patched Tweak.x successfully!')
        "

    - name: Compile Dylib
      run: |
        cd clicker
        export THEOS=~/theos
        make FINALPACKAGE=1

    - name: Collect Dylib
      run: |
        mkdir -p output
        find clicker/.theos -name "*.dylib" -exec cp {} output/AutoClicker.dylib \;
        ls -la output/AutoClicker.dylib

    - name: Upload AutoClicker Dylib
      uses: actions/upload-artifact@v4
      with:
        name: Standalone-AutoClicker
        path: output/AutoClicker.dylib
