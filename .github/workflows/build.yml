name: Build iOS AutoClicker Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone SimpleAutoClicker source
      run: |
        git clone --recursive https://github.com/DYY-Studio/iOS-SimpleAutoClicker.git clicker

    - name: Patch Tweak.x
      run: |
        cp patch_tweak.py clicker/patch_tweak.py
        cd clicker
        python3 patch_tweak.py

    - name: Check Logos syntax
      run: |
        cd clicker
        if grep -q '%hook\|%ctor\|%new\|%orig' Tweak.x; then
          echo "HAS_LOGOS=true" >> $GITHUB_ENV
        else
          echo "HAS_LOGOS=false" >> $GITHUB_ENV
          cp Tweak.x Tweak.m
        fi

    - name: Install Theos for Logos
      if: env.HAS_LOGOS == 'true'
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        rm -rf $THEOS/sdks && mkdir -p $THEOS/sdks
        git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
        cp -r /tmp/theos-sdks/*.sdk $THEOS/sdks/ 2>/dev/null || true
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Preprocess Logos to ObjC
      if: env.HAS_LOGOS == 'true'
      run: |
        cd clicker
        $THEOS/bin/logos.pl Tweak.x > Tweak.m

    - name: Compile Dylib
      run: |
        cd clicker
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        SOURCES=$(find . -name "*.m" | grep -v ".theos" | grep -v "Test" | tr '\n' ' ')
        INCLUDES=$(find . -type d | grep -v ".theos" | grep -v ".git" | sed 's/^/-I/' | tr '\n' ' ')
        xcrun clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -dynamiclib \
          -o AutoClicker.dylib \
          $SOURCES \
          -I. $INCLUDES \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework QuartzCore \
          -framework CoreFoundation \
          -fobjc-arc \
          -ObjC
        ls -la AutoClicker.dylib

    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-iOS-Dylib
        path: clicker/AutoClicker.dylib
