name: Build iOS AutoClicker Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile AutoClicker.dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"
        xcrun clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=15.0 \
          -dynamiclib \
          -o AutoClicker.dylib \
          AutoClicker.m \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework QuartzCore \
          -fobjc-arc \
          -ObjC
        ls -la AutoClicker.dylib
        file AutoClicker.dylib

    - name: Upload AutoClicker.dylib
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-Dylib
        path: AutoClicker.dylib
